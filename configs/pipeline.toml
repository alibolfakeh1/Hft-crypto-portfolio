# Versioned pipeline configuration. Every run records a hash of this file.
# The start dates are limited by the Actions cache, not by what the archives hold. Backfill runs newest
# first, so moving a start date earlier only adds older work. See storage below before doing that.

schema_version = 1

[universe]
symbols = ["BTCUSDT", "ETHUSDT"]

[bars]
# Multiples of one minute. Each must divide a UTC day, so a day partition holds whole bars.
timeframes_minutes = [5, 15, 30, 60, 120, 240, 1440]

[storage]
# Measured against DATA_QUOTA_GB. The environment variable wins over this default. The Actions cache limit is 10 GB
# per repository. A new copy is saved before the old one is pruned, so two copies and the poll cache must fit at
# once, which means under half the limit until measured sizes say otherwise.
default_quota_gb = 4.0
# What survives between runs through the Actions cache. raw and quarantine stay on the runner.
persisted_zones = ["curated", "features", "catalog"]

# Nothing is downloaded from a source unless it is enabled here, and every source ships disabled. With none
# enabled, the network client refuses every host, and each job reports "no approved source configured".
# A source is enabled only once it has been named as approved. See docs/03_DATA_SOURCES.md.
#
# Every key below is required, and a misspelt or unknown key is an error, so a typo cannot read as a default.
#   stamp_kind              How a row is stamped. One of: exact, aggregate_one_price, taker_many_prices, floored,
#                           batched. Only exact and aggregate_one_price may be read in IDEAL mode.
#   fill_span_allowance_ms  How long after its stamp a row's fills can run, plus the stamp's resolution. A row is
#                           knowable at its stamp plus this. UNVERIFIED everywhere until measured on the source,
#                           including stressed days. It is also the midnight and minute window of the reconciliation
#                           rule: one constant, so raising the window to pass a day also moves every knowable time.
#                           Under 60000.
#   allowance_state         placeholder or measured. measured also needs allowance_evidence: dates, the stressed days
#                           among them, and who signed. Health raises an alert for an enabled source on a placeholder.
#   continuity              trade_id if rows carry an id with no skips, which can prove an empty minute. none if
#                           not, which makes every empty minute a gap, as convention C2 says.
#   bar_source              trades, as decision D-12 says, or official_1m for a tier T0 path with no trades.
#   candle_allowance_ms     Required on official_1m, with no default. How long after its close a candle is final. project-manager
#                           declares it. A source on the word UNDECLARED cannot be enabled, and A must cover it.
#   candle_allowance_state  Required on official_1m. declared or measured.
#   candle_check            Required on official_1m. not_shown, or shown once `candle-check` shows a candle holds no print
#                           from after its close on the declared sample days (leak recheck, section 15). shown also needs
#                           candle_check_evidence. IDEAL rests on it, and nothing else stops if it is not shown.
#   attribution             Printed on everything published from this source's data, where its terms ask for it.
[sources.binance]
# Decision D-29, which replaces D-17: USD-M perpetual history, for personal, non-monetized research. The code opens only
# data.binance.vision under /data/futures/um, for this source. Every other Binance host stays barred, and so do spot,
# coin-margined and option paths. Its terms bar live proprietary execution, automated commercial orders and signals
# for compensation, so no live path may read from it, and going commercial later means redoing the research.
# All timing values here are UNVERIFIED placeholders until measured on files fetched for research, and they describe
# aggregate rows, which the candle path does not read. Bars come from official candles under D-31 and ruling 7 of the
# leak recheck, which D-12 does not describe, so they say so, and their reconciliation reports not_available. Reads and
# fetches stop at the last opened date of the fold plan, which is held in code.
enabled = false
prohibited = false
archive_base = "https://data.binance.vision/data/futures/um"
stamp_kind = "aggregate_one_price"
fill_span_allowance_ms = 250.0
allowance_state = "placeholder"
continuity = "trade_id"
bar_source = "official_1m"
# D-33: 10 s, equal to A, in state declared. Not measured, because an archive gives no receipt time.
candle_allowance_ms = 10000
candle_allowance_state = "declared"
candle_check = "not_shown"
attribution = "Derived from Binance Vision data, CC BY-NC-SA 4.0. Not associated with or endorsed by Binance."
terms_note = "Binance Vision Dataset Terms (2026-08-26): CC BY-NC-SA 4.0, non-commercial. Research history under decision D-29."

[sources.bybit]
enabled = false
prohibited = false
trades_base = "https://public.bybit.com/trading"
book_base = "https://quote-saver.bycsi.com/orderbook/linear"
# The book file name changed depth at a date we do not hard-code. Every depth is tried, in this order.
book_depths = [200, 500]
stamp_kind = "exact"
fill_span_allowance_ms = 250.0
allowance_state = "placeholder"
# Rows carry a random match id, so nothing in a file can prove that no row is missing.
continuity = "none"
bar_source = "trades"
terms_note = "Terms under review in docs/03_DATA_SOURCES.md. Not approved, so not downloaded."

[sources.kraken]
# Decision D-23: not a source for this project. The hourly poll's client speaks only to Kraken, so the poll stays named
# here and contacts nothing, and the live path has no source until one is approved.
enabled = false
prohibited = true
trades_url = "https://api.kraken.com/0/public/Trades"
stamp_kind = "taker_many_prices"
fill_span_allowance_ms = 250.0
allowance_state = "placeholder"
continuity = "trade_id"
bar_source = "trades"
terms_note = "Ruled out by decision D-23. Nothing is requested from it."

[fetch]
timeout_s = 60.0
attempts = 3
backoff_s = 2.0
max_download_bytes = 2_000_000_000
max_uncompressed_bytes = 8_000_000_000

[catchup]
# Dates older than this are a backfill, which the watermarks can stop. Newer dates are routine catch-up.
routine_window_days = 7
retry_base_minutes = 30
retry_max_hours = 24
# Book files are large and a runner's disk is small, so an opt-in run takes one day at most.
max_book_days_per_run = 1

[latency]
# bookDepth stamps are truncated to the second, so a row stamped 00:00:06 may be as late as 00:00:06.999.
# It is treated as knowable one second after its stamp. That is all it covers: no publication delay is included.
book_depth_allowance_s = 1.0
# A row stamped later than this after we received it is refused, because no clock is that far off.
max_future_skew_s = 60.0

# Official candles are a reconciliation check, for a source whose bars come from trades. An aggregate trade file gives
# each aggregate one timestamp, but official candles count each fill in its own minute, so volume stamped just before a
# boundary can appear after it, within the source's fill_span_allowance_ms.
#
# PLACEHOLDER, not frozen. Freeze under C12 before the first V0 run, from data outside any test block, and a change after
# that is a counted trial. This rule was designed after seeing Binance files (D-18), so it is rechecked on files fetched
# for research. A failed check flags minutes and never removes them. bar_price_rel starts near what one venue's trades
# and candles should agree to (N-05), with no real data seen since; project-manager says whether that counted as a trial.
[reconcile.BTCUSDT]
daily_total_abs = 0.000001
bar_price_rel = 0.0005
fill_count_rel = 0.01

[reconcile.ETHUSDT]
daily_total_abs = 0.000001
bar_price_rel = 0.0005
fill_count_rel = 0.01

# ---- Archive datasets. Lower priority numbers run first on the same date. --------------------------------
# live_eligible: a live run may read this dataset. A live run sees no book, under C17, so no book dataset is.
# max_quiet_s: a silence longer than this is recorded as a gap even when ids run on. PLACEHOLDER, UNVERIFIED until
# measured on the approved source. Zero means the dataset has no trades to fall quiet.

# USD-M perpetual BTCUSDT and ETHUSDT, the symbols in [universe]. Candles and funding are tier T0, and nothing else
# from this source is fetched unless named: book depth and aggregate trades stay opt-in.
[[datasets]]
id = "binance.klines"
venue = "binance"
adapter = "binance_klines"
kind = "klines"
curated = "candles_official"
tier = "T0"
# Monthly files, as section 4.3 of the coverage record recommends: 384 requests for stage one, against 6,036 for daily.
granularity = "month"
# T_start of the fold plan. The last opened date holds in code, and it is what ends these partitions.
start = "2020-01-01"
overdue_hours = 36.0
light = true
opt_in = false
priority = 0
live_eligible = false
max_quiet_s = 0.0

[[datasets]]
id = "binance.fundingRate"
venue = "binance"
adapter = "binance_funding"
kind = "fundingRate"
curated = "funding"
tier = "T0"
granularity = "month"
start = "2020-01-01"
overdue_hours = 72.0
light = true
opt_in = false
priority = 1
live_eligible = false
max_quiet_s = 0.0

[[datasets]]
id = "binance.bookDepth"
venue = "binance"
adapter = "binance_book_depth"
kind = "bookDepth"
curated = "book_depth"
tier = "T2"
granularity = "day"
start = "2026-01-01"
overdue_hours = 36.0
light = false
opt_in = true
priority = 2
live_eligible = false
max_quiet_s = 0.0

[[datasets]]
id = "binance.aggTrades"
venue = "binance"
adapter = "binance_agg_trades"
kind = "aggTrades"
curated = "trades"
tier = "T1"
granularity = "day"
start = "2026-06-01"
overdue_hours = 36.0
light = false
opt_in = true
priority = 3
live_eligible = false
# UNVERIFIED placeholder, until measured on files fetched for research.
max_quiet_s = 900.0

[[datasets]]
id = "bybit.trades"
venue = "bybit"
adapter = "bybit_trades"
kind = "trades"
curated = "trades"
tier = "T1"
granularity = "day"
start = "2026-10-01"
overdue_hours = 36.0
light = false
opt_in = false
priority = 4
live_eligible = false
max_quiet_s = 900.0

[[datasets]]
id = "bybit.orderbook"
venue = "bybit"
adapter = "bybit_book"
kind = "orderbook"
curated = "book_replay"
tier = "T2"
granularity = "day"
