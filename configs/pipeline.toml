# Versioned pipeline configuration. Every run records a hash of this file.
# The start dates are limited by the Actions cache, not by what the archives hold. Backfill runs newest
# first, so moving a start date earlier only adds older work. See storage below before doing that.

schema_version = 1

[universe]
symbols = ["BTCUSDT", "ETHUSDT"]

[bars]
# Multiples of one minute. Each must divide a UTC day, so a day partition holds whole bars.
timeframes_minutes = [5, 15, 30, 60, 120, 240, 1440]

[storage]
# Measured against DATA_QUOTA_GB. The environment variable wins over this default. The Actions cache
# limit is 10 GB per repository, and the poll cache needs room beside this one.
default_quota_gb = 8.0
# What survives between runs through the Actions cache. raw and quarantine stay on the runner.
persisted_zones = ["curated", "features", "catalog"]

# Nothing is downloaded from a source unless it is enabled here, and every source starts disabled. With none
# enabled, the network client refuses every host, and each job reports "no approved source configured".
# A source is enabled only once it has been named as approved. See docs/03_DATA_SOURCES.md.
[sources.binance]
# Adapter kept and tested on generated files only. Decision D-17 rules this source out for research and results,
# so enabling it is an error. Changing that needs a new decision and this flag removed on purpose.
enabled = false
prohibited = true
archive_base = "https://data.binance.vision/data/futures/um"
terms_note = "Binance Vision Dataset Terms (2026-08-26): CC BY-NC-SA 4.0, non-commercial. Not used, by decision D-17."

[sources.bybit]
enabled = false
trades_base = "https://public.bybit.com/trading"
book_base = "https://quote-saver.bycsi.com/orderbook/linear"
# The book file name changed depth at a date we do not hard-code. Every depth is tried, in this order.
book_depths = [200, 500]
terms_note = "Terms under review in docs/03_DATA_SOURCES.md. Not approved, so not downloaded."

[sources.kraken]
enabled = false
trades_url = "https://api.kraken.com/0/public/Trades"
terms_note = "Terms under review in docs/03_DATA_SOURCES.md. Not approved, so not downloaded."

[fetch]
timeout_s = 60.0
attempts = 3
backoff_s = 2.0
max_download_bytes = 2_000_000_000
max_uncompressed_bytes = 8_000_000_000

[catchup]
# Dates older than this are a backfill, which the watermarks can stop. Newer dates are routine catch-up.
routine_window_days = 7
retry_base_minutes = 30
retry_max_hours = 24
# Book files are large and a runner's disk is small, so an opt-in run takes one day at most.
max_book_days_per_run = 1

[latency]
# bookDepth stamps are truncated to the second, so a row stamped 00:00:06 may be as late as 00:00:06.999.
# It is treated as knowable one second after its stamp.
book_depth_allowance_s = 1.0

# Official candles are a reconciliation check, for a venue that publishes them. An aggregate trade file gives
# each aggregate one timestamp, but official candles count each fill in its own minute, so volume stamped just
# before a boundary can appear after it. A daily difference must be covered by trades this close to midnight, or
# it is an error. These values are placeholders: repeat the checks on the approved source and set them from that.
[reconcile.BTCUSDT]
daily_total_abs = 0.000001
boundary_window_ms = 250.0
bar_price_abs = 15.0

[reconcile.ETHUSDT]
daily_total_abs = 0.000001
boundary_window_ms = 250.0
bar_price_abs = 1.5

# ---- Archive datasets. Lower priority numbers run first on the same date. --------------------------------

