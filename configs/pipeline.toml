# ---- Hourly poll of closed trades. Own DATA_ROOT and own cache, so it stays small and fast. ---------------

[poll]
venue = "kraken"
# The cursor starts here whenever the poll state is empty, so a lost cache rebuilds through catch-up.
start_date = "2026-10-25"
page_size = 1000
min_interval_s = 1.1
# A minute is emitted as a bar only once it closed this long before the fetch ended.
bar_grace_s = 60.0
default_time_budget_s = 120.0
# Consecutive missed hourly slots that count as a state change worth a commit.
missed_slots_alert = 6
default_quota_gb = 1.0

[[poll.pairs]]
symbol = "BTCUSD"
pair = "XBTUSD"
archive_symbol = "BTCUSDT"

[[poll.pairs]]
symbol = "ETHUSD"
pair = "ETHUSD"
archive_symbol = "ETHUSDT"

# Polled bars against the benchmark venue's bars. If those are different markets, this is a sanity check and not
# a reconciliation of the same data. A wide median difference means something is wrong with one side.
[poll.cross_venue]
median_abs_close_diff_bps_warn = 30.0
min_return_corr_warn = 0.5

[report]
# Stale means the newest bar is older than this. Stale data is labelled and never shown as current.
stale_after_hours = 60.0
# Equity marks and max drawdown use this timeframe. Volatility and Sharpe use daily close-to-close returns.
equity_timeframe_minutes = 60
# Empty until a source is approved. The report then shows no benchmarks and says why.
benchmark_venue = ""
benchmark_symbols = ["BTCUSDT", "ETHUSDT"]
