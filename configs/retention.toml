# Retention policy, enforced by `hft-crypto retention` and by raw deletion during ingest.
# Owned by data-steward. See docs/05_DATA_LIFECYCLE.md.
#
# A real delete needs the explicit --execute flag and a rule marked reviewed. Developers do not mark rules
# reviewed. The one exception below is called out on the rule itself.
#
# Age is measured from when our file was created, not from the date of the data inside it, so a backfilled
# file is never deleted early because its data is old.

schema_version = 1
policy_version = "2026-11-04.1"

[watermarks]
warn_pct = 70.0
stop_backfill_pct = 80.0
purge_raw_pct = 85.0
purge_runs_pct = 90.0
critical_pct = 95.0
headroom_alert_days = 3.0

[sample_days]
# One day per month is kept as a regression sample in case an archive disappears. On GitHub the raw zone
# does not survive a run, so the sample is held as curated data only.
day_of_month = 1
kinds = ["trades", "book_depth"]
protect_raw = false

# Required by the owner's GitHub-only decision of 2026-11-04: raw is transient and goes as soon as its curated
# data passes. It is marked reviewed because the workflow cannot run without it. data-steward has not confirmed
# it yet, and python-reviewer should look at it first.
[[rules]]
id = "raw-archive-after-curated"
zone = "raw/archive"
kinds = ["klines", "aggTrades", "trades", "bookDepth", "fundingRate", "orderbook"]
min_age_days = 0.0
reviewed = true
reviewed_note = "Owner decision of 2026-11-04, carried by the P1 brief. Awaiting data-steward confirmation."
watermark_bypass_pct = 85.0
# Each entry is <derived kind>:<accepted check statuses>. All must exist among the file's descendants.
[rules.requires]
klines = ["candles_official:pass"]
fundingRate = ["funding:pass"]
bookDepth = ["book_depth:pass"]
aggTrades = ["trades:pass", "bars_1m:pass,warn,provisional"]
trades = ["trades:pass", "bars_1m:pass,warn,provisional"]
orderbook = ["book_replay:pass"]

# Bars and other flow data stay. This limits the trades behind them, which take most of the cache. Without it
# the quota eventually fills and the pipeline stops at the critical watermark. Not reviewed, so it only
# shows up in the dry run. The raw files are already gone, so this relies on the public archive being able to
# rebuild the data, which is a judgement call for data-steward. See docs/05_DATA_LIFECYCLE.md section 1.
[[rules]]
id = "curated-trades-window"
zone = "curated/trades"
kinds = ["trades"]
min_age_days = 90.0
reviewed = false
rebuildable_from_archive = true
[rules.requires]
trades = ["bars_1m:pass,warn"]

[[rules]]
id = "raw-live-after-retention"
zone = "raw/live"
kinds = ["*"]
min_age_days = 90.0
reviewed = false
[rules.requires]
"*" = ["bars_1m:pass,warn"]

[[rules]]
id = "runs-unpublished-expired"
zone = "results/runs"
kinds = ["run"]
min_age_days = 180.0
reviewed = false
unpublished_only = true
watermark_bypass_pct = 90.0
watermark_min_age_days = 30.0
