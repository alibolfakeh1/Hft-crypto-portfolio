name: CI

# Tests and code checks. Needs no network beyond installing dependencies, and no secrets.
# Every test runs on generated data. The large-file and market-data checks are in tests/data/test_safety.py.

on:
  push:
    branches: ["main", "pipeline/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install
        run: uv sync --frozen --python "${{ matrix.python }}"
      - name: Ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
      - name: Mypy
        run: uv run --frozen mypy
      - name: Pytest
        run: uv run --frozen pytest -q
