name: Daily pipeline

# The main path of the data center. See docs/08_DATA_CENTER.md section 5.
#
# Which sources may be downloaded is decided only in configs/pipeline.toml. Every source ships disabled, so until a
# source is approved this makes no data request at all: it runs its checks and reports "no approved source
# configured". There is no fallback. Binance is prohibited by decision D-17, and enabling it is a config error.
#
# raw lives on the runner for this job only. curated, features and catalog persist through the Actions cache, within
# DATA_QUOTA_GB. A lost cache rebuilds through catch-up, and the report shows partial coverage until it has.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      time_budget:
        description: "Stop starting new work after this long"
        default: "50m"
      include_book:
        description: "Also process one day of order book files. Needs an approved source"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  DATA_QUOTA_GB: "8"
  TIME_BUDGET: ${{ inputs.time_budget || '50m' }}

jobs:
  pipeline:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    permissions:
      contents: read
      actions: read # to read this repository's own cache usage for the report
    outputs:
      cache_saved: ${{ steps.save.outcome }}
    steps:
      - name: Choose paths outside the repository
        run: |
          {
            echo "DATA_ROOT=$RUNNER_TEMP/data_root"
            echo "LIVE_ROOT=$RUNNER_TEMP/live_root"
            echo "OUT_DIR=$RUNNER_TEMP/output"
            echo "RESULTS_DIR=$RUNNER_TEMP/results_branch"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false
      - name: Install
        run: uv sync --frozen --no-dev --python 3.12
      - name: Restore the data center
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DATA_ROOT }}/curated
            ${{ env.DATA_ROOT }}/features
            ${{ env.DATA_ROOT }}/catalog
          key: data-center-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: data-center-v1-
      - name: Restore the poll data, read only
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.LIVE_ROOT }}
          key: live-poll-v1-none
          restore-keys: live-poll-v1-
      - name: Read the results branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RESULTS_DIR/run_log"
          gh api "repos/$GITHUB_REPOSITORY/contents/run_log/poll_runs.jsonl?ref=results" \
            -H "Accept: application/vnd.github.raw+json" > "$RESULTS_DIR/run_log/poll_runs.jsonl" \
            || echo "No poll log on the results branch yet."
      - name: Catch up on what the catalog says is missing
        run: |
          book=""
          if [ "${{ inputs.include_book }}" = "true" ]; then book="--include-book"; fi
          uv run --frozen --no-dev hft-crypto ingest --light $book --time-budget "$TIME_BUDGET" --delete-raw-after-curated
      - name: Check polled bars
        run: uv run --frozen --no-dev hft-crypto reconcile-live --live-root "$LIVE_ROOT"
      - name: Plan retention, without deleting
        run: uv run --frozen --no-dev hft-crypto retention
      - name: Read cache use
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/cache/usage" > "$RUNNER_TEMP/cache_usage.json" \
            || echo "Cache usage is not available."
      - name: Health
        run: uv run --frozen --no-dev hft-crypto health --actions-cache-json "$RUNNER_TEMP/cache_usage.json"
      - name: Report
        run: |
          uv run --frozen --no-dev hft-crypto report --published \
            --out-dir "$OUT_DIR" \
            --live-root "$LIVE_ROOT" \
            --results-dir "$RESULTS_DIR" \
            --actions-cache-json "$RUNNER_TEMP/cache_usage.json"
      - name: Save the data center
        id: save
        if: always() && steps.restore.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.DATA_ROOT }}/curated
            ${{ env.DATA_ROOT }}/features
            ${{ env.DATA_ROOT }}/catalog
          key: data-center-v1-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Upload the page
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ env.OUT_DIR }}/site
      - name: Upload the small results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: results-bundle
          path: ${{ env.OUT_DIR }}/results
          retention-days: 7

  deploy-pages:
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  publish-results:
    # Runs no project code, because this is the only job here that can write to the repository.
    needs: pipeline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: results-bundle
          path: ${{ runner.temp }}/bundle
      - name: Append to the results branch
        # Copied first, because switching to the results branch removes it from the working tree.
        run: |
          cp .github/scripts/publish_results.sh "$RUNNER_TEMP/publish_results.sh"
          bash "$RUNNER_TEMP/publish_results.sh" "$RUNNER_TEMP/bundle" "Daily summary"

  prune-cache:
    needs: pipeline
    if: always() && needs.pipeline.outputs.cache_saved == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # to delete this repository's own superseded cache entries
    steps:
      - name: Keep only the newest copy
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh cache list --repo "$GITHUB_REPOSITORY" --key data-center-v1- --sort created_at --order desc \
            --limit 100 --json id --jq '.[1:][].id' |
            while read -r id; do gh cache delete "$id" --repo "$GITHUB_REPOSITORY"; done
