name: Source check

# Reports whether GitHub-hosted runners can reach a few public, non-dataset endpoints. It stores nothing and needs no
# secrets. It runs only when started by hand, and it no longer touches any data archive: decision D-17 rules Binance
# out, and no source is approved yet, so this must not access a dataset host. Add a probe here only for a source that
# has been approved.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Probe sources
        run: |
          {
            echo "### Source check"
            echo
            echo "| Source | HTTP status | Size in bytes |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          get_probe() {
            out=$(curl -sL -m 30 -A 'Mozilla/5.0' -o /dev/null -w '%{http_code} | %{size_download}' "$2" || echo 'failed |')
            echo "| $1 | $out |" >> "$GITHUB_STEP_SUMMARY"
          }
          get_probe  "Telegram API"                    "https://api.telegram.org/"
