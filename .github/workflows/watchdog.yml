name: Watchdog

# Checks the last result on the results branch, and alerts the owner through Telegram. The logic is in
# .github/scripts/watchdog.py, which says what it does in each case and uses the standard library only.
# It fails the run when an alert could not be delivered, and never because of bad data in the result, which is itself
# something to report. Set the repository variable WATCHDOG_EXPECT_RESULT_AFTER to a UTC time to have "no result"
# alert from then on, in place of waiting for it to have been missing longer than the age limit.

on:
  schedule:
    - cron: "41 7,19 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: watchdog
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Remember what was last sent
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/watchdog
          key: watchdog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: watchdog-v1-
      - name: Check the last result
        env:
          GH_TOKEN: ${{ github.token }}
          MAX_AGE_HOURS: ${{ vars.WATCHDOG_MAX_AGE_HOURS || '48' }}
          WATCHDOG_EXPECT_RESULT_AFTER: ${{ vars.WATCHDOG_EXPECT_RESULT_AFTER }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_IDS: ${{ secrets.TELEGRAM_OWNER_IDS }}
          STATE_DIR: ${{ runner.temp }}/watchdog
        run: python3 .github/scripts/watchdog.py
      - name: Keep what was last sent
        if: always()
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/watchdog
          key: watchdog-v1-${{ github.run_id }}-${{ github.run_attempt }}
